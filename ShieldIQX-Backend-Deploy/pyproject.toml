[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldiq-api"
version = "0.1.0"
description = "API service for the ShieldIQ fraud investigation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "firebase-admin>=6.5,<8.0",
  "google-cloud-bigquery>=3.25,<4.0",
  "google-cloud-firestore>=2.19,<3.0",
  "google-cloud-storage>=2.18,<4.0",
  "google-genai>=1.0,<2.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "reportlab>=4.2,<5.0",
  "slowapi>=0.1.9,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
